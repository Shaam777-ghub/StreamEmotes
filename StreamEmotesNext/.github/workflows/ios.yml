name: Build iOS Simulator
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project StreamEmotesNext.xcodeproj -scheme StreamEmotesNext -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: StreamEmotesNext-Simulator
          path: build/Build/Products/Debug-iphonesimulator/StreamEmotesNext.app

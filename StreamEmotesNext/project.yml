name: StreamEmotesNext
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.sham.streamemotesnext
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  StreamEmotesNext:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Web]
      - path: App/Web
        type: folder
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: StreamEmotes
  StreamEmotesNextUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: StreamEmotesNext
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sham.streamemotesnext.uitests
        TEST_TARGET_NAME: StreamEmotesNext
schemes:
  StreamEmotesNext:
    build:
      targets:
        StreamEmotesNext: all
    test:
      targets:
        - StreamEmotesNextUITests

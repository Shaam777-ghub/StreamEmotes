<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}</style></head><body><div id="player"></div><script src="https://player.twitch.tv/js/embed/v1.js"></script><script>
const channel=new URLSearchParams(location.search).get('channel');
if(channel&&/^[a-zA-Z0-9_]{1,25}$/.test(channel))new Twitch.Player('player',{channel,width:'100%',height:'100%',parent:[location.hostname],autoplay:false});
</script></body></html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StreamEmotes — Twitch Player</title>
<style>
html,body{margin:0;padding:0;background:#09090b;color:white;font:14px system-ui, sans-serif;width:100%;height:100%}
#player{height:100dvh;min-height:300px;width:100%;overflow:hidden}
iframe{border:0;width:100%;height:100%;display:block}
#fallback{display:none;padding:16px;text-align:center}
a{color:#bf94ff}
</style>
</head>
<body>
<div id="player"></div>
<div id="fallback"></div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const channel = (params.get('channel') || '').trim().toLowerCase();
  const fallback = document.getElementById('fallback');
  if (!/^[a-z0-9_]{1,25}$/.test(channel)) {
    fallback.textContent = 'Не задано корректное имя Twitch-канала.';
    fallback.style.display = 'block';
    return;
  }
  const url = new URL('https://player.twitch.tv/');
  url.searchParams.set('channel', channel);
  url.searchParams.set('parent', location.hostname);
  url.searchParams.set('autoplay', 'false');
  url.searchParams.set('muted', 'false');
  const iframe = document.createElement('iframe');
  iframe.src = url.toString();
  iframe.allow = 'autoplay; fullscreen; encrypted-media; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.title = 'Twitch — ' + channel;
  document.getElementById('player').appendChild(iframe);
  fallback.innerHTML = 'Если встроенный плеер недоступен, <a rel="noopener noreferrer" target="_blank" href="https://www.twitch.tv/' + channel + '">открой Twitch</a>.';
  fallback.style.display = 'block';
})();
</script>
</body>
</html>

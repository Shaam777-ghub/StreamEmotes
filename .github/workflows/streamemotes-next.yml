name: StreamEmotes Next checks
on:
  push:
    branches: [streamemotes-next]
    paths: ['StreamEmotesNext/**', '.github/workflows/streamemotes-next.yml']
  pull_request:
    paths: ['StreamEmotesNext/**', '.github/workflows/streamemotes-next.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamemotes-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chat-and-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: StreamEmotesNext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check App/Web/app.js && node --test Tests/core.test.cjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node Tests/ui.test.cjs
  ios-build:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: StreamEmotesNext
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: xcodebuild -project StreamEmotesNext.xcodeproj -scheme StreamEmotesNext -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verify bundled web interface
        run: |
          test -f build/Build/Products/Debug-iphonesimulator/StreamEmotesNext.app/Web/index.html
          test -f build/Build/Products/Debug-iphonesimulator/StreamEmotesNext.app/Web/app.js
      - name: Run app in iPhone Simulator
        timeout-minutes: 10
        run: |
          xcrun simctl list devices available --json > /tmp/next-devices.json
          SIMULATOR_ID=$(python3 -c 'import json; d=json.load(open("/tmp/next-devices.json")); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v.get("isAvailable") and v["name"].startswith("iPhone")))')
          echo "Selected simulator: $SIMULATOR_ID"
          xcodebuild -project StreamEmotesNext.xcodeproj -scheme StreamEmotesNext -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -derivedDataPath build -resultBundlePath SimulatorResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Save simulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StreamEmotesNext-Simulator-Tests
          path: StreamEmotesNext/SimulatorResults.xcresult
          if-no-files-found: warn
      - name: Build for iPhone without signing
        run: xcodebuild -project StreamEmotesNext.xcodeproj -scheme StreamEmotesNext -sdk iphoneos -configuration Release -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: StreamEmotesNext-Simulator
          path: StreamEmotesNext/build/Build/Products/Debug-iphonesimulator/StreamEmotesNext.app
          if-no-files-found: error

# Retry simulator launch after the previous macOS job remained queued.

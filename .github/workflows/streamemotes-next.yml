name: StreamEmotes Next checks
on:
  push:
    branches: [streamemotes-next]
    paths: ['StreamEmotesNext/**', '.github/workflows/streamemotes-next.yml']
  pull_request:
    paths: ['StreamEmotesNext/**', '.github/workflows/streamemotes-next.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamemotes-next-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chat-and-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: StreamEmotesNext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check App/Web/app.js && node --test Tests/core.test.cjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node Tests/ui.test.cjs && node Tests/session.test.cjs
  ios-build:
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: StreamEmotesNext
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iPhone without signing
        run: xcodebuild -project StreamEmotesNext.xcodeproj -scheme StreamEmotesNext -sdk iphoneos -configuration Release -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Verify bundled web interface
        run: |
          test -f build-device/Build/Products/Release-iphoneos/StreamEmotesNext.app/Web/index.html
          test -f build-device/Build/Products/Release-iphoneos/StreamEmotesNext.app/Web/app.js
      - uses: actions/upload-artifact@v4
        with:
          name: StreamEmotesNext-iPhone-Unsigned
          path: StreamEmotesNext/build-device/Build/Products/Release-iphoneos/StreamEmotesNext.app
          if-no-files-found: error

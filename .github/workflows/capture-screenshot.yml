name: Capture StreamEmotes iPhone screenshot

on:
  push:
    paths:
      - '.github/workflows/capture-screenshot.yml'
  workflow_dispatch:
    inputs:
      screen:
        description: "Screen to capture"
        required: true
        default: "player"
        type: choice
        options:
          - player
          - home
      channel:
        description: "Twitch channel for player screenshot"
        required: true
        default: "forsen"
        type: string

permissions:
  contents: read

jobs:
  screenshot:
    name: iOS Simulator screenshot
    runs-on: macos-15-intel
    timeout-minutes: 30

      - name: Select screen for Simulator only
        env:
          PREVIEW_SCREEN: ${{ github.event.inputs.screen || 'player' }}
          PREVIEW_CHANNEL: ${{ github.event.inputs.channel || 'forsen' }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os
          import re
          from pathlib import Path

          screen = os.environ.get('PREVIEW_SCREEN', 'player')
          channel = os.environ.get('PREVIEW_CHANNEL', 'forsen')
          if screen not in ('player', 'home'):
              raise SystemExit('Unknown screen')
          if not re.fullmatch(r'[A-Za-z0-9_]{1,25}', channel):
              raise SystemExit('Invalid Twitch channel')
          if screen == 'home':
              print('Capturing native home screen')
          else:
              # This modifies only the temporary Actions checkout; never the GitHub repository.
              app = Path('Sources/App.swift')
              if not app.exists():
                  raise SystemExit('Sources/App.swift not found')
              swift = f'''import SwiftUI
          @main
          struct StreamEmotesApp: App {{
              var body: some Scene {{
                  WindowGroup {{
                      NavigationStack {{ PlayerView(channel: "{channel}") }}
                          .preferredColorScheme(.dark)
                  }}
              }}
          }}
          '''
              app.write_text(swift, encoding='utf-8')
              print('Capturing native PlayerView for:', channel)
          PYCODE
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project StreamEmotes.xcodeproj \
            -scheme StreamEmotes -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/StreamEmotesSimBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Start simulator and take PNG screenshot
        env:
          PREVIEW_SCREEN: ${{ github.event.inputs.screen || 'player' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          SIMULATOR_ID="$(python3 - <<'PYCODE'
          import json
          import subprocess
          raw = subprocess.check_output(['xcrun','simctl','list','devices','available','-j'], text=True)
          data = json.loads(raw)
          devices = [d for group in data['devices'].values() for d in group
                     if d.get('isAvailable', True) and d.get('udid') and 'iPhone' in d.get('name','')]
          if not devices:
              raise SystemExit('No iPhone simulators available')
          priorities = ['iPhone 16 Pro', 'iPhone 16', 'iPhone 15 Pro', 'iPhone 15']
          selected = next((d for n in priorities for d in devices if d['name']==n), devices[0])
          print(selected['udid'])
          PYCODE
          )"
          echo "Using simulator $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl ui "$SIMULATOR_ID" appearance dark || true
          xcrun simctl status_bar "$SIMULATOR_ID" override \
            --time '9:41' --batteryState charged --batteryLevel 100 \
            --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 || true
          APP="$RUNNER_TEMP/StreamEmotesSimBuild/Build/Products/Debug-iphonesimulator/StreamEmotes.app"
          test -d "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          echo "Launching app bundle: $BUNDLE_ID"
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" "$BUNDLE_ID"
          sleep 18
          mkdir -p screenshots
          xcrun simctl io "$SIMULATOR_ID" screenshot "screenshots/StreamEmotes-${PREVIEW_SCREEN}-simulator.png"
          file "screenshots/StreamEmotes-${PREVIEW_SCREEN}-simulator.png"
      - name: Upload real simulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StreamEmotes-simulator-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7

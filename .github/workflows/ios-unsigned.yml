name: Build iOS IPA (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project StreamEmotes.xcodeproj \
            -scheme StreamEmotes -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA for AltStore / Sideloadly signing
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/StreamEmotes.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$GITHUB_WORKSPACE/StreamEmotes-unsigned.ipa" Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StreamEmotes-unsigned-IPA
          path: StreamEmotes-unsigned.ipa
          if-no-files-found: error
